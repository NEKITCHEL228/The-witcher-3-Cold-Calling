<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <rect width="320" height="320" rx="16" fill="#141c1e" stroke="#254d4b" stroke-width="3"/>
  <!-- Murky Water Ripples Background -->
  <path d="M20,290 Q80,270 160,285 Q240,300 300,280 L300,320 L20,320 Z" fill="#0f2928" opacity="0.7"/>
  <!-- Slimy Wet Shoulders -->
  <path d="M50,320 C80,230 110,210 160,210 C210,210 240,230 270,320 Z" fill="#1f4e4b" stroke="#133533" stroke-width="3"/>
  <!-- Dorsal Fin along Spine -->
  <polygon points="160,185 152,140 160,130 168,140" fill="#2dd4bf" opacity="0.6"/>
  <!-- Gills on Neck -->
  <path d="M130,205 Q140,215 130,225" stroke="#115e59" stroke-width="3" fill="none"/>
  <path d="M190,205 Q180,215 190,225" stroke="#115e59" stroke-width="3" fill="none"/>
  <!-- Head (Amphibious/Fish-like) -->
  <ellipse cx="160" cy="145" rx="55" ry="46" fill="#2d6a66" stroke="#133e3b" stroke-width="3"/>
  <!-- Webbed Finned Ears -->
  <polygon points="105,145 65,115 80,155 70,175 105,160" fill="#2dd4bf" stroke="#0f766e" stroke-width="2"/>
  <polygon points="215,145 255,115 240,155 250,175 215,160" fill="#2dd4bf" stroke="#0f766e" stroke-width="2"/>
  <!-- Bulging Glossy Red/Orange Eyes -->
  <circle cx="132" cy="130" r="14" fill="#f97316" stroke="#9a3412" stroke-width="2"/>
  <circle cx="188" cy="130" r="14" fill="#f97316" stroke="#9a3412" stroke-width="2"/>
  <circle cx="132" cy="130" r="6" fill="#111827"/>
  <circle cx="188" cy="130" r="6" fill="#111827"/>
  <circle cx="129" cy="126" r="3" fill="#ffffff"/>
  <circle cx="185" cy="126" r="3" fill="#ffffff"/>
  <!-- Wide Fish Maw with Needle Teeth -->
  <path d="M125,165 Q160,190 195,165" stroke="#042f2e" stroke-width="3" fill="#0f172a"/>
  <polygon points="135,168 138,176 141,168" fill="#f0fdfa"/>
  <polygon points="147,171 150,180 153,171" fill="#f0fdfa"/>
  <polygon points="159,172 162,181 165,172" fill="#f0fdfa"/>
  <polygon points="171,171 174,180 177,171" fill="#f0fdfa"/>
  <polygon points="183,168 186,176 189,168" fill="#f0fdfa"/>
  <!-- Dripping Water Droplets -->
  <ellipse cx="140" cy="195" rx="3" ry="5" fill="#38bdf8" opacity="0.8"/>
  <ellipse cx="180" cy="192" rx="2" ry="4" fill="#38bdf8" opacity="0.8"/>
  <ellipse cx="110" cy="175" rx="2" ry="4" fill="#38bdf8" opacity="0.7"/>
</svg>
